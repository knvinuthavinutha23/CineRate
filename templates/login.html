{% extends "base.html" %}

{% block title %}
CineRate - Login
{% endblock %}


{% block content %}

<main class="auth-page">

    <div class="auth-card">

        <div class="auth-heading">

            <div class="auth-icon">
                🔐
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to continue to CineRate.
            </p>

        </div>


        <form method="POST"
              action="/login">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="auth-button">

                Login

            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="/register">
                Create one
            </a>

        </p>

    </div>

</main>

{% endblock %}
