{% extends "base.html" %}

{% block title %}
CineRate - Register
{% endblock %}


{% block content %}

<main class="auth-page">

    <div class="auth-card">

        <div class="auth-heading">

            <div class="auth-icon">
                🎬
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Join CineRate and share your movie experience.
            </p>

        </div>


        <form method="POST"
              action="/register">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required>

            </div>


            <button
                type="submit"
                class="auth-button">

                Create Account

            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="/login">
                Login here
            </a>

        </p>

    </div>

</main>

{% endblock %}
